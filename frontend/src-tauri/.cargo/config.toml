[target.aarch64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-mmacosx-version-min=14.2",
]

[env]
MACOSX_DEPLOYMENT_TARGET = { value = "14.2", force = true }
CMAKE_OSX_DEPLOYMENT_TARGET = "14.2"

# Google OAuth Desktop client credentials for the Calendar integration.
# Uncomment and set to your own test credentials for local development, or
# leave commented and export them in your shell. Release builds get these
# from GitHub Actions secrets. See src/calendar/credentials.rs for why we
# ship both client_id AND client_secret for Google's Desktop flow.
# MEETILY_GOOGLE_CLIENT_ID = "123-abc.apps.googleusercontent.com"
# MEETILY_GOOGLE_CLIENT_SECRET = "GOCSPX-..."